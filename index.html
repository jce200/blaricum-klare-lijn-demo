<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Blaricum in klare lijn</title>
  <link rel="icon" href="favicon.svg">
  <link rel="stylesheet" href="stijl.css">
  <script type="importmap">
    { "imports": { "three": "./vendor/three.module.js", "three/addons/": "./vendor/jsm/" } }
  </script>
</head>
<body>
  <header class="balk">
    <img class="merk" src="woordmerk.svg" alt="Monastic">
    <nav class="keuze" aria-label="Standpunt">
      <button type="button" data-stand="hoekpand">Het hoekpand</button>
      <button type="button" data-stand="kruising">De kruising</button>
      <button type="button" data-stand="wijzer">De handwijzer</button>
      <button type="button" data-stand="erf">Het erf</button>
      <button type="button" data-stand="straat">De straat</button>
      <button type="button" data-stand="plein">Het plein</button>
      <button type="button" data-stand="dorp">Het dorp</button>
    </nav>
    <nav class="keuze" aria-label="Tijdstip">
      <button type="button" data-tijd="nacht" aria-pressed="true">Nacht</button>
      <button type="button" data-tijd="dag" aria-pressed="false">Dag</button>
    </nav>
    <div class="keuze" aria-label="Animatie">
      <button type="button" id="intro-knop" class="actie" aria-pressed="false">Intro</button>
      <button type="button" id="rondleiding" class="actie" aria-pressed="false">Rondleiding</button>
    </div>
  </header>
  <main class="kader">
    <canvas id="doek"></canvas>
    <div class="cel-deur-laag" id="cel-deur-laag" hidden aria-hidden="true">
      <img class="cel-deur" id="cel-deur-0" src="cels/schim-cel-0.webp" alt="">
      <img class="cel-deur" id="cel-deur-1" src="cels/schim-cel-1.webp" alt="" hidden>
      <img class="cel-deur" id="cel-deur-2" src="cels/schim-cel-2.webp" alt="" hidden>
    </div>
    <p class="strip-bijschrift" id="strip-bijschrift" hidden>22:14 · Blaricum.</p>
    <div class="strip-ballon" id="strip-ballon" hidden role="status" aria-live="polite">
      <span class="ballon-spreker" id="ballon-spreker"></span>
      <p class="ballon-tekst" id="ballon-tekst"></p>
    </div>
    <div class="verhaal-keuze" id="verhaal-keuze" hidden role="group" aria-label="Vervolg"></div>
    <button type="button" class="overslaan" id="overslaan-knop" hidden>Overslaan →</button>
    <aside class="cartouche" id="cartouche" aria-live="polite">
      <strong id="cartouche-titel">Het hoekpand · Nacht</strong>
      <span id="cartouche-sub">Hoek Meentweg en Huizerweg, Blaricum</span>
    </aside>
    <p class="melding" id="melding">Het dorp wordt getekend.</p>
  </main>
  <p class="voet">Sleep om te draaien, scrol om in te zoomen · toetsen 1–7 voor standpunten, I voor de openingsscène, Esc om over te slaan, spatie voor rondleiding.</p>
  <script type="module" src="app.js"></script>
</body>
</html>
